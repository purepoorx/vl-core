name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      # workflow_dispatch may target an older tag: check that ref out explicitly,
      # otherwise the default branch HEAD is compiled but published under the
      # requested tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Compile and package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          name="vl-core-${TAG}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then bin="vl-core.exe"; else bin="vl-core"; fi
          mkdir -p "stage/${name}" out
          go build -trimpath -ldflags "-s -w -buildid=" -o "stage/${name}/${bin}" ./cmd/vl-core
          cp README.md LICENSE "stage/${name}/"
          cp -R examples "stage/${name}/"
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -q -r "../out/${name}.zip" "${name}")
            asset="${name}.zip"
          else
            tar -czf "out/${name}.tar.gz" -C stage "${name}"
            asset="${name}.tar.gz"
          fi
          (cd out && sha256sum "${asset}" > "${asset}.sha256")
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify assets
        run: |
          set -euo pipefail
          ls -lh dist
          test "$(find dist -type f | wc -l)" -eq 12

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "vl-core $TAG" \
              --generate-notes
          fi
